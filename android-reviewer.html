<style>
:root{--bg:#fff;--fg:#1c2340;--mu:#667;--cd:#f3f4f9;--ac:#2d3a8c;--ok:#1b7f3b;--no:#b3261e;--bd:#d5d8e6;box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14172b;--fg:#e8eaf6;--mu:#9aa;--cd:#1f2340;--ac:#8c9cff;--ok:#5fd187;--no:#ff8a80;--bd:#33385c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:auto;padding:16px}h1{font-size:1.3rem;margin:.2em 0}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
button{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--fg);padding:8px 12px;border-radius:8px;cursor:pointer}

.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.q{font-size:1.1rem;font-weight:600}.o{display:block;width:100%;text-align:left;margin:8px 0}
.ok{border-color:var(--ok)!important;color:var(--ok)}.no{border-color:var(--no)!important;color:var(--no)}
.mu{color:var(--mu);font-size:.9rem}code,input{font-family:ui-monospace,monospace}
input{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:3px 6px;width:11em}
.fc{min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.scroll{overflow-x:auto}li{margin:4px 0}

[4,"Medical Calculator weight limits?","500 pounds / 225 kilograms"],
[4,"DecimalFormat pattern that rounds to the nearest tenth?","#.#"]];
const L=[
["final EditText tickets = (EditText)","findViewById","(R.id.tvTickets);"],
["final Spinner group = (Spinner)findViewById(R.id.","spGroup",");"],
["cost.","setOnClickListener","(new View.OnClickListener() {"],
["numberOfTickets = Integer.","parseInt","(tickets.getText().toString());"],
["weightEntered = Double.","parseDouble","(weight.getText().toString());"],
["groupChoice = group.","getSelectedItem","().toString();"],
["totalCost = costPerTicket ","*","numberOfTickets;"],
["DecimalFormat currency = new DecimalFormat(\"","$###,###.##","\");"],
["result.","setText","(\"Cost for \" + groupChoice + \" is \" + currency.format(totalCost));"],
["setContentView(R.layout.","activity_main",");"],
["getSupportActionBar().","setLogo","(R.mipmap.ic_launcher);"],
["if (lbToKilo.","isChecked","()) {"],
["convertedWeight = weightEntered ","/","conversionRate;"],
["DecimalFormat tenth = new DecimalFormat(\"","#.#","\");"],
["Toast.makeText(MainActivity.this, \"Pounds must be less than 500\", Toast.","LENGTH_LONG",").show();"],
["startActivity(new Intent(MainActivity.this, ","Recipe",".class));"]];
let ch=0,mode='quiz',deck=[],i=0,sc=0,done=0,flip=0;
const $=id=>document.getElementById(id),sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const pool=()=>D.filter(d=>!ch||d[0]==ch);
function start(){const p=pool(),all=[...new Set(p.map(x=>x[2]))];deck=sh(p).map(d=>({d,o:sh([d[2],...sh(all.filter(x=>x!=d[2])).slice(0,3)])}));i=0;sc=0;done=0;flip=0;render()}
function nav(){$('tabs').innerHTML=[['quiz','Quiz'],['cards','Flashcards'],['lab','Lab code']].map(t=>`<button class="${mode==t[0]?'on':''}" onclick="mode='${t[0]}';start()">${t[1]}</button>`).join('');
$('chs').innerHTML=mode=='lab'?'':[[0,'All'],[1,'Ch 1'],[2,'Ch 2'],[3,'Ch 3'],[4,'Ch 4']].map(c=>`<button class="${ch==c[0]?'on':''}" onclick="ch=${c[0]};start()">${c[1]}</button>`).join('')}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(){nav();const v=$('v');
if(mode=='lab')return lab(v);
if(i>=deck.length){v.innerHTML=`<div class="card"><div class="q">Done! ${mode=='quiz'?'Score: '+sc+' / '+deck.length:'All cards cleared'}</div><p><button onclick="start()">Restart</button></p></div>`;return}
const x=deck[i];
if(mode=='quiz'){v.innerHTML=`<div class="mu">Question ${i+1} of ${deck.length} · Score ${sc}</div><div class="card"><div class="q">${esc(x.d[1])}</div>${x.o.map((o,k)=>`<button class="o" onclick="pick(${k})">${esc(o)}</button>`).join('')}<div id="fb"></div></div>`}
else{v.innerHTML=`<div class="mu">Card ${i+1} of ${deck.length} · Ch ${x.d[0]}</div><div class="card fc" onclick="flip=!flip;render()"><div class="${flip?'':'q'}">${esc(flip?x.d[2]:x.d[1])}</div></div><div class="bar"><button onclick="flip=!flip;render()">Flip</button>${flip?`<button onclick="nxt(1)">Got it</button><button onclick="nxt(0)">Again</button>`:''}</div>`}}
function pick(k){if(done)return;done=1;const x=deck[i],b=document.querySelectorAll('.o');b.forEach((e,j)=>{if(x.o[j]==x.d[2])e.classList.add('ok');else if(j==k)e.classList.add('no')});if(x.o[k]==x.d[2])sc++;$('fb').innerHTML='<p><button onclick="i++;done=0;render()">Next</button></p>'}
function nxt(g){if(!g)deck.push(deck[i]);i++;flip=0;render()}
function lab(v){v.innerHTML=`<p class="mu">Fill in the blank in each line of code from the lab apps (case matters).</p><div class="card scroll">${L.map((l,k)=>`<div style="margin:10px 0"><code>${esc(l[0])}<input id="i${k}" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(l[2])}</code> <span id="r${k}"></span></div>`).join('')}<button onclick="chk()">Check all</button></div>
<div class="card"><b>Lab checklist</b><ol><li><b>Ch1</b> Hello World, My Name: new Empty Activity project, edit TextView text, set id, run on emulator.</li><li><b>Ch2</b> Easy Recipes: ConstraintLayout, strings.xml, ImageView (res/drawable + contentDescription), Button, second Activity (Recipe), onClick with startActivity.</li><li><b>Ch3</b> Concert Tickets: orange #FF9800 background, Number input with hint, Spinner with string array + prompt, Button, TextView result, parseInt, getSelectedItem, DecimalFormat, setText.</li><li><b>Ch4</b> Medical Calculator: launcher icon via Image Asset Studio, Action bar logo, RadioGroup with 2 RadioButtons, nested If Else with isChecked, Toast validation, DecimalFormat "#.#".</li></ol></div>`}
function chk(){let n=0;L.forEach((l,k)=>{const ok=$('i'+k).value.trim()==l[1];n+=ok;$('r'+k).innerHTML=ok?'<b class="ok">✓</b>':'<b class="no">✗ '+esc(l[1])+'</b>'});alert(n+' / '+L.length+' correct')}
start();
</script></body></html>
